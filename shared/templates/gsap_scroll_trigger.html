<!-- GSAP ScrollTrigger (auto-injected by ARCANE) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script>
(function() {
  if (typeof gsap === 'undefined' || typeof ScrollTrigger === 'undefined') return;
  gsap.registerPlugin(ScrollTrigger);
  // Animate all sections on scroll
  document.querySelectorAll('section, [class*="section"], .card, article').forEach((el, i) => {
    gsap.from(el, {
      opacity: 0,
      y: 40,
      duration: 0.8,
      delay: 0.05,
      ease: 'power2.out',
      scrollTrigger: {
        trigger: el,
        start: 'top 88%',
        toggleActions: 'play none none none'
      }
    });
  });
  // Stagger children in grids
  document.querySelectorAll('.grid, [class*="grid"], .flex.flex-wrap, [class*="cards"]').forEach(grid => {
    const items = grid.querySelectorAll(':scope > div, :scope > article, :scope > li');
    if (items.length > 1) {
      gsap.from(items, {
        opacity: 0,
        y: 30,
        duration: 0.6,
        stagger: 0.12,
        ease: 'power2.out',
        scrollTrigger: { trigger: grid, start: 'top 88%' }
      });
    }
  });
  // Animate headings
  document.querySelectorAll('h1, h2, h3').forEach(el => {
    gsap.from(el, {
      opacity: 0,
      y: 20,
      duration: 0.7,
      ease: 'power2.out',
      scrollTrigger: { trigger: el, start: 'top 90%' }
    });
  });
  // Parallax for hero sections
  const hero = document.querySelector('[class*="hero"], section:first-of-type');
  if (hero) {
    gsap.to(hero, {
      yPercent: 15,
      ease: 'none',
      scrollTrigger: { trigger: hero, start: 'top top', end: 'bottom top', scrub: true }
    });
  }
  // Animated counters
  document.querySelectorAll('[data-counter]').forEach(el => {
    const target = parseInt(el.dataset.counter);
    if (isNaN(target)) return;
    const suffix = el.dataset.counter.replace(/[0-9,. ]+/, '');
    el.textContent = '0';
    ScrollTrigger.create({
      trigger: el,
      start: 'top 90%',
      onEnter: () => {
        gsap.to({val: 0}, {
          val: target,
          duration: 2,
          ease: 'power2.out',
          onUpdate: function() {
            el.textContent = Math.round(this.targets()[0].val).toLocaleString('ru-RU') + suffix;
          }
        });
      },
      once: true
    });
  });
})();
</script>
