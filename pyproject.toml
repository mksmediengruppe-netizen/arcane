[project]
name = "arcane"
version = "1.0.0"
description = "ARCANE — Autonomous AI Agency System"
requires-python = ">=3.11"
license = {text = "Proprietary"}

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
