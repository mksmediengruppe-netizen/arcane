# ARCANE — Nginx Configuration
# Domain: arcaneai.ru
# Backend: FastAPI on port 8100
# Frontend: Vite build served as static files

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name arcaneai.ru www.arcaneai.ru;
    return 301 https://arcaneai.ru$request_uri;
}

# Main HTTPS server
server {
    listen 443 ssl http2;
    server_name arcaneai.ru www.arcaneai.ru;

    # SSL certificates (managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/arcaneai.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/arcaneai.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1024;

    # Frontend static files
    root /root/arcane/frontend/dist;
    index index.html;

    # API proxy to FastAPI backend
    location /api/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE support — disable buffering
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # WebSocket proxy
    location /ws/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
    }

    # Workspace files (screenshots, artifacts)
    location /workspace/ {
        alias /root/workspace/;
        autoindex off;
        expires 1h;
    }

    # Frontend SPA — serve index.html for all non-API routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
    }

    client_max_body_size 100M;
}
