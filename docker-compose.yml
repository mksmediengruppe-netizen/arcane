version: "3.8"

services:
  arcane-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: arcane-api
    restart: unless-stopped
    ports:
      - "8100:8100"
    env_file:
      - .env
    environment:
      - PORT=8100
      - ENVIRONMENT=production
    volumes:
      - workspace:/root/workspace
      - screenshots:/root/workspace/screenshots
      - ./:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8100/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - arcane-net

  postgres:
    image: postgres:16-alpine
    container_name: arcane-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: arcane
      POSTGRES_USER: arcane
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-arcane_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - arcane-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arcane -d arcane"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: arcane-redis
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy volatile-lru
      --appendonly yes
      --appendfsync everysec
      --save 60 1
      --save 300 10
    volumes:
      - redis_data:/data
    ports:
      - "6380:6379"
    networks:
      - arcane-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: arcane-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-arcane}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-arcane_secret}
    volumes:
      - minio_data:/data
    ports:
      - "9002:9000"
      - "9003:9001"
    networks:
      - arcane-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3

  qdrant:
    image: qdrant/qdrant:latest
    container_name: arcane-qdrant
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6334:6333"
    networks:
      - arcane-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3

  # Browser service removed — Playwright runs inside arcane-api via tool_executor.py

volumes:
  postgres_data:
  redis_data:
  minio_data:
  qdrant_data:
  workspace:
  screenshots:

networks:
  arcane-net:
    driver: bridge
