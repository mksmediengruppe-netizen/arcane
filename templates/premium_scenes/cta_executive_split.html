<!-- SCENE: cta.executive_split.v1 -->
<section class="relative {{BG}} {{SECTION_PADDING}} overflow-hidden" id="contact">
  {{DECORATOR}}
  <!-- Gradient orbs -->
  <div class="gradient-orb w-80 h-80 bg-blue-500 -top-20 -right-20 opacity-20"></div>
  <div class="gradient-orb w-60 h-60 bg-violet-500 bottom-0 left-10 opacity-15"></div>
  
  <div class="{{CONTAINER_CLASS}} px-5 md:px-8 relative z-10">
    <div class="grid md:grid-cols-2 gap-12 items-center">
      
      <!-- Left: text -->
      <div class="flex flex-col gap-6 {{REVEAL_CLASS}}">
        <h2 class="{{HEADING_CLASS}} text-3xl md:text-5xl {{TEXT}} leading-tight">
          {{HEADLINE}}
        </h2>
        <p class="{{BODY_CLASS}} text-lg {{MUTED}} leading-relaxed">
          {{SUBHEADLINE}}
        </p>
        <div class="flex flex-wrap gap-3">
          <a href="{{CTA_PRIMARY_HREF}}" class="{{BUTTON_CLASS}}">
            {{CTA_PRIMARY_TEXT}}
          </a>
        </div>
        <!-- Trust note -->
        <p class="text-xs {{MUTED}}">✓ Бесплатная консультация · ✓ Без обязательств · ✓ Ответим быстро</p>
      </div>
      
      <!-- Right: contact form -->
      <div class="{{SURFACE_CLASS}} p-8 {{REVEAL_CLASS}} {{HOVER_CLASS}}">
        <h3 class="{{HEADING_CLASS}} text-xl {{TEXT}} mb-6">Оставьте заявку</h3>
        <form class="flex flex-col gap-4" onsubmit="return false;">
          <div class="flex flex-col gap-1.5">
            <label class="text-xs font-medium {{MUTED}} uppercase tracking-wide">Ваше имя</label>
            <input type="text" placeholder="Иван Иванов" class="w-full px-4 py-3 rounded-xl {{BORDER}} border {{BG}} {{TEXT}} text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/30 transition-all" />
          </div>
          <div class="flex flex-col gap-1.5">
            <label class="text-xs font-medium {{MUTED}} uppercase tracking-wide">Телефон</label>
            <input type="tel" placeholder="+7 (999) 000-00-00" class="w-full px-4 py-3 rounded-xl {{BORDER}} border {{BG}} {{TEXT}} text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/30 transition-all" />
          </div>
          <div class="flex flex-col gap-1.5">
            <label class="text-xs font-medium {{MUTED}} uppercase tracking-wide">Сообщение</label>
            <textarea rows="3" placeholder="Опишите вашу ситуацию..." class="w-full px-4 py-3 rounded-xl {{BORDER}} border {{BG}} {{TEXT}} text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/30 transition-all resize-none"></textarea>
          </div>
          <button type="submit" class="{{BUTTON_CLASS}} w-full justify-center">
            Отправить заявку
          </button>
          <p class="text-xs {{MUTED}} text-center">Нажимая кнопку, вы соглашаетесь с политикой конфиденциальности</p>
        </form>
      </div>
      
    </div>
  </div>
</section>
