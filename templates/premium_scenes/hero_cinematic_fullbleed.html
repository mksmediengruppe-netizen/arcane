<!-- SCENE: hero.cinematic_fullbleed.v1 -->
<section class="relative min-h-screen flex items-center overflow-hidden {{BG}}">
  {{DECORATOR}}

  <!-- Background image with parallax -->
  <div class="absolute inset-0 z-0" data-parallax>
    <img
      src="{{HERO_MEDIA_URL}}"
      alt="{{HEADLINE}}"
      class="{{MEDIA_CLASS}} w-full h-full object-cover scale-110"
      loading="eager"
    />
    <!-- Multi-layer gradient overlay -->
    <div class="absolute inset-0 bg-gradient-to-b from-black/70 via-black/40 to-black/80"></div>
    <div class="absolute inset-0 bg-gradient-to-r from-black/50 via-transparent to-transparent"></div>
  </div>

  <!-- Animated gradient orbs -->
  <div class="absolute inset-0 z-[1] pointer-events-none overflow-hidden">
    <div class="gradient-orb w-[500px] h-[500px] bg-violet-600/40 -top-32 -right-32" style="animation: orbit-1 18s ease-in-out infinite;"></div>
    <div class="gradient-orb w-[350px] h-[350px] bg-blue-500/30 bottom-20 left-10" style="animation: orbit-2 22s ease-in-out infinite;"></div>
    <div class="gradient-orb w-[250px] h-[250px] bg-fuchsia-500/20 top-1/2 left-1/3" style="animation: orbit-3 15s ease-in-out infinite;"></div>
  </div>

  <!-- Noise texture overlay -->
  <div class="absolute inset-0 z-[2] grain-overlay pointer-events-none"></div>

  <!-- Subtle grid lines -->
  <div class="absolute inset-0 z-[2] pointer-events-none opacity-[0.04]"
       style="background-image: linear-gradient(to right, white 1px, transparent 1px), linear-gradient(to bottom, white 1px, transparent 1px); background-size: 80px 80px;"></div>

  <!-- Content -->
  <div class="relative z-10 {{CONTAINER_CLASS}} px-5 md:px-8 py-24 md:py-32">
    <div class="max-w-3xl flex flex-col gap-8 {{REVEAL_CLASS}}">

      <!-- Kicker badge -->
      <div class="inline-flex items-center gap-2.5 px-4 py-2 rounded-full bg-white/10 backdrop-blur-md border border-white/20 text-white/90 text-xs font-semibold w-fit uppercase tracking-[0.2em]">
        <span class="w-2 h-2 rounded-full bg-green-400 animate-pulse"></span>
        {{KICKER}}
      </div>

      <!-- Headline -->
      <h1 class="{{HEADING_CLASS}} text-5xl sm:text-6xl md:text-7xl lg:text-8xl text-white leading-[1.02] tracking-tight">
        {{HEADLINE}}
      </h1>

      <!-- Subheadline -->
      <p class="{{BODY_CLASS}} text-lg md:text-xl text-white/70 max-w-xl leading-relaxed">
        {{SUBHEADLINE}}
      </p>

      <!-- CTA buttons -->
      <div class="flex flex-wrap items-center gap-4 pt-2">
        <a href="{{CTA_PRIMARY_HREF}}"
           class="{{BUTTON_CLASS}} group relative overflow-hidden">
          <span class="relative z-10">{{CTA_PRIMARY_TEXT}}</span>
          <span class="absolute inset-0 bg-white/20 translate-y-full group-hover:translate-y-0 transition-transform duration-300 ease-out"></span>
        </a>
        <a href="{{CTA_SECONDARY_HREF}}"
           class="inline-flex items-center gap-2.5 px-6 py-3.5 text-sm font-medium text-white border border-white/25 rounded-xl hover:bg-white/10 hover:border-white/40 transition-all duration-300 backdrop-blur-sm">
          {{CTA_SECONDARY_TEXT}}
          <svg class="w-4 h-4 transition-transform group-hover:translate-x-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3"/></svg>
        </a>
      </div>

      <!-- Trust signals -->
      <div class="flex flex-wrap items-center gap-6 pt-4 text-white/50 text-sm">
        <span class="flex items-center gap-2">
          <svg class="w-4 h-4 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
          {{TRUST_1}}
        </span>
        <span class="flex items-center gap-2">
          <svg class="w-4 h-4 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
          {{TRUST_2}}
        </span>
        <span class="flex items-center gap-2">
          <svg class="w-4 h-4 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
          {{TRUST_3}}
        </span>
      </div>

    </div>
  </div>

  <!-- Scroll indicator with pulse animation -->
  <div class="absolute bottom-8 left-1/2 -translate-x-1/2 z-10 flex flex-col items-center gap-3 text-white/40">
    <span class="text-[10px] uppercase tracking-[0.3em] font-medium">Прокрутить</span>
    <div class="relative w-5 h-9 border border-white/30 rounded-full flex items-start justify-center p-1.5">
      <div class="w-1 h-2 bg-white/60 rounded-full animate-bounce"></div>
    </div>
  </div>

  <!-- Keyframes for orbs -->
  <style>
    @keyframes orbit-1 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(-30px, 40px) scale(1.1); }
      66% { transform: translate(20px, -20px) scale(0.95); }
    }
    @keyframes orbit-2 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(40px, -30px) scale(1.15); }
    }
    @keyframes orbit-3 {
      0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.2; }
      50% { transform: translate(-20px, 20px) scale(1.2); opacity: 0.35; }
    }
  </style>
</section>
