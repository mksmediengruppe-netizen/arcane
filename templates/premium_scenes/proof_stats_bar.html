<!-- SCENE: proof.stats_bar.v1 -->
<section class="relative {{BG}} {{SECTION_PADDING}} overflow-hidden">
  {{DECORATOR}}

  <!-- Noise overlay -->
  <div class="absolute inset-0 grain-overlay pointer-events-none z-[1]"></div>

  <div class="{{CONTAINER_CLASS}} px-5 md:px-8 relative z-10">

    <!-- Optional section header -->
    <div class="text-center mb-12 {{REVEAL_CLASS}}">
      <h2 class="{{HEADING_CLASS}} text-2xl md:text-4xl {{TEXT}} mb-3">{{HEADLINE}}</h2>
      <p class="{{BODY_CLASS}} text-base {{MUTED}} max-w-lg mx-auto">{{SUBHEADLINE}}</p>
    </div>

    <!-- Stats grid with dividers -->
    <div class="{{DIVIDER_CLASS}} border-t border-b {{BORDER}} py-12 md:py-16">
      <div class="grid grid-cols-2 md:grid-cols-4 {{GAP}} {{REVEAL_CLASS}}">

        <!-- Stat 1 -->
        <div class="flex flex-col items-center gap-3 text-center group relative px-4">
          <!-- Decorative accent dot -->
          <div class="w-3 h-3 rounded-full bg-gradient-to-br {{ACCENT_BG}} mb-2 opacity-60 group-hover:opacity-100 group-hover:scale-125 transition-all duration-300"></div>
          <span class="{{HEADING_CLASS}} text-4xl md:text-5xl lg:text-6xl font-black {{TEXT}} tabular-nums" data-counter="{{STAT_1_VALUE}}">0</span>
          <span class="{{BODY_CLASS}} {{MUTED}} text-sm md:text-base font-medium">{{STAT_1_LABEL}}</span>
          <span class="text-xs {{MUTED}} opacity-60 max-w-[140px]">{{STAT_1_DETAIL}}</span>
          <!-- Vertical divider (hidden on mobile, shown between items on desktop) -->
          <div class="absolute right-0 top-4 bottom-4 w-px {{BORDER}} bg-current opacity-10 hidden md:block"></div>
        </div>

        <!-- Stat 2 -->
        <div class="flex flex-col items-center gap-3 text-center group relative px-4">
          <div class="w-3 h-3 rounded-full bg-gradient-to-br {{ACCENT_BG}} mb-2 opacity-60 group-hover:opacity-100 group-hover:scale-125 transition-all duration-300"></div>
          <span class="{{HEADING_CLASS}} text-4xl md:text-5xl lg:text-6xl font-black {{TEXT}} tabular-nums" data-counter="{{STAT_2_VALUE}}">0</span>
          <span class="{{BODY_CLASS}} {{MUTED}} text-sm md:text-base font-medium">{{STAT_2_LABEL}}</span>
          <span class="text-xs {{MUTED}} opacity-60 max-w-[140px]">{{STAT_2_DETAIL}}</span>
          <div class="absolute right-0 top-4 bottom-4 w-px {{BORDER}} bg-current opacity-10 hidden md:block"></div>
        </div>

        <!-- Stat 3 -->
        <div class="flex flex-col items-center gap-3 text-center group relative px-4">
          <div class="w-3 h-3 rounded-full bg-gradient-to-br {{ACCENT_BG}} mb-2 opacity-60 group-hover:opacity-100 group-hover:scale-125 transition-all duration-300"></div>
          <span class="{{HEADING_CLASS}} text-4xl md:text-5xl lg:text-6xl font-black {{TEXT}} tabular-nums" data-counter="{{STAT_3_VALUE}}">0</span>
          <span class="{{BODY_CLASS}} {{MUTED}} text-sm md:text-base font-medium">{{STAT_3_LABEL}}</span>
          <span class="text-xs {{MUTED}} opacity-60 max-w-[140px]">{{STAT_3_DETAIL}}</span>
          <div class="absolute right-0 top-4 bottom-4 w-px {{BORDER}} bg-current opacity-10 hidden md:block"></div>
        </div>

        <!-- Stat 4 -->
        <div class="flex flex-col items-center gap-3 text-center group relative px-4">
          <div class="w-3 h-3 rounded-full bg-gradient-to-br {{ACCENT_BG}} mb-2 opacity-60 group-hover:opacity-100 group-hover:scale-125 transition-all duration-300"></div>
          <span class="{{HEADING_CLASS}} text-4xl md:text-5xl lg:text-6xl font-black {{TEXT}} tabular-nums" data-counter="{{STAT_4_VALUE}}">0</span>
          <span class="{{BODY_CLASS}} {{MUTED}} text-sm md:text-base font-medium">{{STAT_4_LABEL}}</span>
          <span class="text-xs {{MUTED}} opacity-60 max-w-[140px]">{{STAT_4_DETAIL}}</span>
        </div>

      </div>
    </div>

    <!-- Bottom trust line -->
    <div class="flex flex-wrap items-center justify-center gap-6 pt-8 {{MUTED}} text-xs {{REVEAL_CLASS}}">
      <span class="flex items-center gap-1.5">
        <svg class="w-4 h-4 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
        {{TRUST_BADGE_1}}
      </span>
      <span class="flex items-center gap-1.5">
        <svg class="w-4 h-4 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
        {{TRUST_BADGE_2}}
      </span>
      <span class="flex items-center gap-1.5">
        <svg class="w-4 h-4 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"/></svg>
        {{TRUST_BADGE_3}}
      </span>
    </div>

  </div>
</section>
