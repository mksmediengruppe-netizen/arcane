<!-- SCENE: trust.authority_facts_rail.v1 — P4-FIX BUG-021: fully expanded -->
<section class="relative {{BG}} {{SECTION_PADDING}} overflow-hidden">
  {{DECORATOR}}
  <!-- Subtle grid background -->
  <div class="absolute inset-0 pointer-events-none opacity-[0.03]"
       style="background-image: linear-gradient(to right, currentColor 1px, transparent 1px), linear-gradient(to bottom, currentColor 1px, transparent 1px); background-size: 60px 60px;"></div>
  <!-- Noise overlay -->
  <div class="absolute inset-0 grain-overlay pointer-events-none z-[1]"></div>

  <div class="{{CONTAINER_CLASS}} px-5 md:px-8 relative z-10">
    <!-- Section header -->
    <div class="text-center flex flex-col items-center gap-4 mb-14 {{REVEAL_CLASS}}">
      <!-- Kicker badge -->
      <div class="inline-flex items-center gap-2.5 px-4 py-2 rounded-full {{SURFACE}} {{BORDER}} border text-xs font-semibold {{ACCENT}} w-fit uppercase tracking-[0.15em]">
        <span class="w-1.5 h-1.5 rounded-full bg-current animate-pulse"></span>
        {{KICKER}}
      </div>
      <!-- Heading -->
      <h2 class="{{HEADING_CLASS}} text-3xl sm:text-4xl md:text-5xl {{TEXT}} leading-tight max-w-3xl tracking-tight">
        {{HEADING}}
      </h2>
      <!-- Subheading -->
      <p class="{{BODY_CLASS}} text-lg md:text-xl {{MUTED}} max-w-2xl leading-relaxed">
        {{SUBHEADING}}
      </p>
    </div>

    <!-- Facts rail — horizontal scrollable on mobile, grid on desktop -->
    <div class="flex flex-nowrap md:grid md:grid-cols-2 lg:grid-cols-4 {{GAP}} overflow-x-auto md:overflow-visible snap-x snap-mandatory pb-4 md:pb-0 -mx-5 px-5 md:mx-0 md:px-0 {{REVEAL_CLASS}}">
      {{FACTS_HTML}}
    </div>

    <!-- Bottom accent line -->
    <div class="mt-12 flex justify-center {{REVEAL_CLASS}}">
      <div class="w-24 h-1 rounded-full {{ACCENT_BG}} opacity-60"></div>
    </div>
  </div>

  <!-- GSAP reveal animation -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (typeof gsap !== 'undefined' && typeof ScrollTrigger !== 'undefined') {
        const section = document.querySelector('[class*="trust"][class*="facts"]') || document.currentScript?.closest('section');
        if (section) {
          gsap.from(section.querySelectorAll('.reveal-on-scroll, [class*="REVEAL"]'), {
            y: 40, opacity: 0, duration: 0.8, stagger: 0.12, ease: 'power2.out',
            scrollTrigger: { trigger: section, start: 'top 80%', once: true }
          });
        }
      }
    });
  </script>
</section>
